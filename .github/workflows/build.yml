name: Build news image

on:
  schedule:
    - cron: '17 4 * * *' # once daily; offset minute to dodge cron congestion
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Fails the job if the news API is unreachable or empty. That is
      # deliberate: the deploy job never runs, so Pages keeps serving the last
      # good image instead of a "could not fetch news" placeholder.
      - name: Render the news image
        run: node build.mjs

      # Requires Settings > Pages > Source: GitHub Actions to be set once, by
      # hand, by a repository admin. Enabling it from here instead (the action's
      # enablement input) needs admin rights that GITHUB_TOKEN does not have.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Deploying in a job of its own, not right after the upload, works around
  # actions/deploy-pages#451: the artifact lookup can come back empty for an
  # artifact finalized under a second earlier. A separate job also means
  # "Re-run failed jobs" retries only this deploy against the artifact that
  # already exists; re-running a single upload-and-deploy job uploads a second
  # artifact and fails on "Multiple artifacts named github-pages".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # The lookup has been seen to lag by up to about 46 seconds, so a miss
      # gets one more attempt a minute later. A miss fails before any
      # deployment is created, so the retry starts clean.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
